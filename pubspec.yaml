name: social_media_app
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.2
  google_fonts: ^8.1.0

  # State Management
  flutter_bloc: ^9.1.1
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Image & Media
  flutter_blurhash: ^0.9.1
  image_picker: ^1.0.7
  mime: ^2.0.0

  # Chat
  flutter_chat_ui: ^2.11.1
  flutter_chat_types: ^3.6.2
  uuid: ^4.2.1

  # Network & API
  dio: ^5.9.2

  # Auth & Backend
  supabase_flutter: ^2.12.4
  flutter_secure_storage: ^10.0.0

  # Cloud Storage
  cloudinary_public: ^0.23.0
  video_player: ^2.11.1
  shared_preferences: ^2.5.5
  http: ^1.6.0
  video_thumbnail: ^0.5.6
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/json/
    - assets/profiles/
