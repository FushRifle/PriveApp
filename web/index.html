<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

<body>
  <script>
    // Force HTML renderer for better compatibility
    window.flutterWebRenderer = "html";

    // Disable service workers during development to avoid caching issues
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
        console.log('Service workers unregistered for development');
      });
    }
  </script>
  <script src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js"></script>
