<!DOCTYPE html>
<html>

<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="social_media_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>social_media_app</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The Flutter web service worker might not be needed in development
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./flutter_service_worker.js?v=' + Date.now());
    }
  </script>
  <script src="flutter.js" defer></script>
</head>

<body>
  <script>
    window.addEventListener('load', function (ev) {
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: async (engineInitializer) => {
          let engine = await engineInitializer.initializeEngine();
          await engine.runApp();
        }
      });
    });
  </script>
</body>

</html>
